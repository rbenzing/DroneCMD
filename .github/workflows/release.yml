name: Release

# Build the package and publish a GitHub Release whenever a version tag is
# pushed. setuptools_scm derives the package version from the tag itself, so the
# tag (e.g. v0.1.0) is the single source of truth for the released version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for setuptools_scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
